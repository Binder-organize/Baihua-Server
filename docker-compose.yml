services:
  db:
    image: postgres:18
    container_name: baihua-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "2423:5432"
    volumes:
      - data:/var/lib/postgresql
    restart: always

volumes:
  data:
    name: baihua-postgres-data
