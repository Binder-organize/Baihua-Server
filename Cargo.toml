[package]
name = "baihua-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "0.8.8", features = ["macros"]}
rustyline = "17.0.2"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"
dirs = "6.0.0"
toml = "0.9.11"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.100"
chrono = "0.4.43"
serde_json = "1.0.149"
serde_with = "3.0"
thiserror = "2.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono"]}
dotenvy = "0.15.7"
uuid = { version = "1.7", features = [ "serde", "v7"] }
bcrypt = "0.18.0"
regex = "1.10"
lazy_static = "1.4"
