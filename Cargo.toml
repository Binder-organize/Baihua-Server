[package]
name = "baihua-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
commander-rust = "1.2.1"
rustyline = "17.0.2"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"
dirs = "6.0.0"
toml = "0.9.11"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.100"
